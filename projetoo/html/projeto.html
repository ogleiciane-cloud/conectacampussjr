<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Eventos</title>
    <link rel="stylesheet" href="projeto.css">
</head>
<body>

    <div class="container">
        <div class="header-decor">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <h1>Cadastro de Eventos do Campus</h1>
        <p class="subtitle">Organize seus eventos com um visual moderno e marcante.</p>

        <form>
            <label for="titulo">Título do Evento</label>
            <input type="text" id="titulo" placeholder="Digite o título do evento">

            <label for="data">Data</label>
            <input type="date" id="data">

            <label for="hora">Horário</label>
            <input type="time" id="hora">

            <label for="local">Local</label>
            <input type="text" id="local" placeholder="Informe o local">

            <label for="descricao">Descrição</label>
            <textarea id="descricao" rows="5" placeholder="Descreva o evento"></textarea>

            <button type="submit">Cadastrar Evento</button>
        </form>
    </div>

</body>
</html>
