<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Notícia</title>
    <link rel="stylesheet" href="projeto%20comunica%20campus%20ribamar/css/editar-noticia.css">
</head>

<body>
    <header>
        <div class="header-badge">Conecta Campus Ribamar</div>
        <h1>Painel Administrativo</h1>
        <p>Editar Notícia</p>
    </header>

    <main class="container">
        <div class="section-title">
            <h2>Atualizar Informações</h2>
            <p>Revise os dados da publicação antes de salvar.</p>
        </div>

        <form>
            <label for="titulo">Título da Notícia</label>
            <input type="text" id="titulo" value="IFMA inaugura novo laboratório de informática">

            <label for="categoria">Categoria</label>
            <select id="categoria">
                <option>Eventos</option>
                <option selected>Notícias</option>
                <option>Editais</option>
                <option>Pesquisa</option>
                <option>Extensão</option>
            </select>

            <label for="autor">Autor</label>
            <input type="text" id="autor" value="Coordenação de Comunicação">

            <label for="data">Data da Publicação</label>
            <input type="date" id="data">

            <label for="imagem">Imagem da Notícia</label>
            <input type="file" id="imagem">

            <label for="resumo">Resumo</label>
            <textarea id="resumo" rows="3">Novo laboratório será utilizado pelos estudantes dos cursos técnicos.</textarea>

            <label for="conteudo">Conteúdo da Notícia</label>
            <textarea id="conteudo" rows="10">O Instituto Federal inaugurou um novo laboratório equipado com computadores modernos para melhorar o ensino dos cursos da área de informática.

As atividades terão início na próxima semana e beneficiarão centenas de estudantes.</textarea>

            <div class="botoes">
                <button type="reset" class="cancelar">Cancelar</button>
                <button type="submit" class="salvar">Salvar Alterações</button>
            </div>
        </form>
    </main>

    <footer>
        Sistema Administrativo • Conecta Campus Ribamar
    </footer>
</body>
</html>
